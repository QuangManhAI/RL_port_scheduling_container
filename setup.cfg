[metadata]
name = rl-port-scheduling-container
version = 0.1.0
description = Gymnasium-style reinforcement learning simulation for container port yard scheduling.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
python_requires = >=3.9
install_requires =
    gymnasium>=0.29
    numpy>=1.23

[options.extras_require]
dev =
    pytest>=7.0
