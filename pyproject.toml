[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-port-scheduling-container"
version = "0.1.0"
description = "Gymnasium-style reinforcement learning simulation for container port yard scheduling."
readme = "README.md"
requires-python = ">=3.11, <3.13"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "port_sim*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "gpu: marks tests as requiring a CUDA-enabled GPU (deselect with '-m \"not gpu\"')",
]

[tool.ruff]
line-length = 100
target-version = "py39"
# Frozen one-shot experiment scripts carry legacy lint debt; they are excluded
# from strict maintained architecture lint checks.
extend-exclude = [
    "src/experiments/exp_*.py",
    "src/experiments/plot_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# CLI scripts bootstrap sys.path before importing src.* modules (E402)
"src/training/*.py" = ["E402"]
"src/experiments/*.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
ignore_missing_imports = true
